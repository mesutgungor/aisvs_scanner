[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aisvs-scanner"
version = "1.0.0"
description = "A full-fledged security verification scanner for the OWASP Artificial Intelligence Security Verification Standard (AISVS)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "OWASP AISVS Scanner Contributors"}
]
keywords = ["owasp", "aisvs", "ai-security", "llm-security", "mcp-security", "rag", "agents", "sast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
aisvs-scan = "aisvs_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aisvs_scanner = ["data/*.json"]
